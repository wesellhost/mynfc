<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your To Do</title>
    <style>
        :root {
            --bg-color: #f4f5f5;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #9ca3af;
            --border-color: #e5e7eb;
            --btn-bg: #374151;
            --btn-hover: #1f2937;
            --danger-bg: #fee2e2;
            --danger-text: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .todo-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #212121;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--text-muted);
        }

        .input-group input[type="text"] {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            color: var(--text-main);
            background: transparent;
        }

        .input-group input[type="number"] {
            width: 70px;
            border: none;
            outline: none;
            font-size: 14px;
            color: var(--text-main);
            background: transparent;
            text-align: center;
        }

        .input-group input::placeholder {
            color: var(--text-muted);
        }

        .add-btn {
            background-color: var(--btn-bg);
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s ease;
        }

        .add-btn:hover {
            background-color: var(--btn-hover);
        }

        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .task-list:empty {
            margin-bottom: 0;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--card-bg);
            transition: all 0.2s ease;
        }

        .task-main {
            display: flex;
            align-items: center;
            flex: 1;
            overflow: hidden;
        }

        .task-main label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            width: 100%;
        }

        .task-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 12px;
        }

        .task-main input[type="checkbox"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--text-muted);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .task-main input[type="checkbox"]:checked {
            background-color: var(--text-muted);
            border-color: var(--text-muted);
        }

        .task-main input[type="checkbox"]:checked::after {
            content: "✓";
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .task-text {
            font-size: 14px;
            font-weight: 500;
            color: #4b5563;
            transition: color 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .task-main input[type="checkbox"]:checked ~ .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .time-badge {
            display: flex;
            align-items: center;
            background: #f3f4f6;
            padding: 2px 8px;
            border-radius: 12px;
            gap: 6px;
        }

        .time-badge.expired {
            background-color: var(--danger-bg);
        }

        .task-time {
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            color: var(--text-muted);
        }

        .time-badge.expired .task-time {
            color: var(--danger-text);
        }

        .play-pause-btn {
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            padding: 0;
        }

        .play-pause-btn:hover {
            color: var(--text-main);
        }

        .task-item.completed .time-badge {
            opacity: 0.5;
            pointer-events: none;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer {
            margin-top: 20px;
        }

        .remaining-count {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .quote {
            font-size: 13px;
            font-style: italic;
            color: var(--text-muted);
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .todo-container {
                padding: 30px 20px;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>

    <main class="todo-container">
        <h1>Your To Do</h1>
        
        <div class="input-group">
            <input type="text" id="task-input" placeholder="Add new task">
            <input type="number" id="time-input" placeholder="Min" min="1">
            <button class="add-btn" id="add-btn">+</button>
        </div>

        <ul class="task-list" id="task-list">
            <!-- Dynamic tasks will be injected here -->
        </ul>

        <div class="footer">
            <div class="remaining-count">Your remaining todos : <span id="count">0</span></div>
            <div class="quote">"Doing what you love is the cornerstone of having abundance in your life." - Wayne Dyer</div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const taskInput = document.getElementById('task-input');
            const timeInput = document.getElementById('time-input');
            const addBtn = document.getElementById('add-btn');
            const taskList = document.getElementById('task-list');
            const countDisplay = document.getElementById('count');

            let tasks = JSON.parse(localStorage.getItem('my-todos')) || [];
            let audioCtx = null;

            // SVGs for modern Apple-style controls
            const playIcon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
            const pauseIcon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

            // Migration mapping for old data structures just in case
            tasks = tasks.map(task => {
                if (task.remainingTime === undefined) {
                    task.remainingTime = task.endTime ? Math.max(0, task.endTime - Date.now()) : null;
                    task.state = task.remainingTime > 0 ? 'paused' : (task.endTime ? 'expired' : 'none');
                    task.endTime = null; 
                }
                return task;
            });

            function saveTasks() {
                localStorage.setItem('my-todos', JSON.stringify(tasks));
            }

            function playModernChime() {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const playNote = (freq, startTime, duration) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, startTime);
                    
                    gain.gain.setValueAtTime(0, startTime);
                    gain.gain.linearRampToValueAtTime(0.4, startTime + 0.05); 
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration); 
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(startTime);
                    osc.stop(startTime + duration);
                };

                const now = audioCtx.currentTime;
                playNote(880, now, 0.4);            
                playNote(1108.73, now + 0.15, 0.6); 
            }

            function formatTime(ms) {
                if (ms <= 0) return "00:00";
                const mins = Math.floor(ms / 60000);
                const secs = Math.floor((ms % 60000) / 1000);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            function renderTasks() {
                taskList.innerHTML = '';
                let remaining = 0;
                const now = Date.now();

                tasks.forEach(task => {
                    if (!task.completed) remaining++;

                    const li = document.createElement('li');
                    li.className = `task-item ${task.completed ? 'completed' : ''}`;
                    
                    let actionsHtml = '';
                    if (task.remainingTime !== null) {
                        const isExpired = task.state === 'expired';
                        let displayMs = task.state === 'playing' ? Math.max(0, task.endTime - now) : task.remainingTime;
                        
                        actionsHtml = `
                            <div class="time-badge ${isExpired ? 'expired' : ''}">
                                <span class="task-time" id="time-${task.id}">${formatTime(displayMs)}</span>
                                ${!isExpired && !task.completed ? `
                                    <button class="play-pause-btn" onclick="toggleTimer(${task.id})">
                                        ${task.state === 'playing' ? pauseIcon : playIcon}
                                    </button>
                                ` : ''}
                            </div>
                        `;
                    }

                    li.innerHTML = `
                        <div class="task-main">
                            <label>
                                <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
                                <span class="task-text">${task.text}</span>
                            </label>
                        </div>
                        <div class="task-actions">
                            ${actionsHtml}
                            <button class="delete-btn" onclick="deleteTask(${task.id})">×</button>
                        </div>
                    `;
                    taskList.appendChild(li);
                });

                countDisplay.textContent = remaining;
            }

            function addTask() {
                const text = taskInput.value.trim();
                const timeStr = timeInput.value.trim();

                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                if (text) {
                    const timeInMs = timeStr && parseInt(timeStr) > 0 ? parseInt(timeStr) * 60 * 1000 : null;

                    tasks.push({
                        id: Date.now(),
                        text: text,
                        remainingTime: timeInMs,
                        endTime: null,
                        state: timeInMs ? 'paused' : 'none',
                        completed: false,
                        notified: false
                    });
                    
                    saveTasks();
                    taskInput.value = '';
                    timeInput.value = '';
                    renderTasks();
                }
            }

            window.toggleTask = function(id) {
                const task = tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    
                    // Auto-pause if task is checked off while running
                    if (task.completed && task.state === 'playing') {
                        task.state = 'paused';
                        task.remainingTime = Math.max(0, task.endTime - Date.now());
                        task.endTime = null;
                    }
                    saveTasks();
                    renderTasks();
                }
            };

            window.toggleTimer = function(id) {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                const task = tasks.find(t => t.id === id);
                if (!task || task.completed || task.state === 'expired') return;

                if (task.state === 'paused') {
                    task.state = 'playing';
                    task.endTime = Date.now() + task.remainingTime;
                } else if (task.state === 'playing') {
                    task.state = 'paused';
                    task.remainingTime = Math.max(0, task.endTime - Date.now());
                    task.endTime = null;
                }
                
                saveTasks();
                renderTasks(); // Re-render to swap play/pause icons
            };

            window.deleteTask = function(id) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                renderTasks();
            };

            addBtn.addEventListener('click', addTask);
            taskInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(); });
            timeInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(); });

            // Timer Loop: Updates DOM only for running tasks
            setInterval(() => {
                let needsRender = false;
                const now = Date.now();

                tasks.forEach(task => {
                    if (task.state === 'playing') {
                        const timeLeft = task.endTime - now;
                        const timeElement = document.getElementById(`time-${task.id}`);

                        if (timeLeft <= 0) {
                            task.state = 'expired';
                            task.remainingTime = 0;
                            if (!task.notified) {
                                playModernChime();
                                task.notified = true;
                            }
                            needsRender = true; // Triggers full render to turn red & hide play button
                        } else if (timeElement) {
                            timeElement.textContent = formatTime(timeLeft);
                        }
                    }
                });

                if (needsRender) {
                    saveTasks();
                    renderTasks();
                }
            }, 1000);

            renderTasks();
        });
    </script>
</body>
</html>
